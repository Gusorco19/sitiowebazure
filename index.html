<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Página Web Sencilla</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Estilos CSS -->
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        header {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }

        main {
            padding: 20px;
        }

        .card {
            background-color: white;
            padding: 20px;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
            max-width: 600px;
            margin: auto;
        }

        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #2980b9;
        }

        footer {
            text-align: center;
            padding: 15px;
            margin-top: 30px;
            color: #777;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Mi Primera Página Web en Azure</h1>
        <p>Hola, me llamo Gabriel. Este es mi sitio en la nube</p>
    </header>

    <main>
        <div class="card">
            <h2>Bienvenido</h2>

            <img src="https://almacenamientogus.blob.core.windows.net/fotosperfil/119768628_1695617573973776_662314358369836672_n.jpg" alt="Foto de perfil" text-align="center" style="width:200px; display:block; margin:auto;">
            <img src="https://almacenamientogus.blob.core.windows.net/fotosperfil/519670142_3107724949429691_4385466787962059452_n.jpg" alt="Foto de perfil 2" text-align="center" style="width:200px; display:block; margin:auto; margin-top:20px;">
            <p>
                Esta es una página web sencilla creada en un solo archivo.
                Incluye estructura HTML, estilos CSS y un poco de JavaScript.
            </p>

            <button onclick="mostrarMensaje()">Haz clic aquí</button>
        </div>
    </main>

    <footer>
        © 2026 - Ejemplo básico HTML
    </footer>

    <!-- JavaScript -->
    <script>
        function mostrarMensaje() {
            alert("Hola 👋 Has hecho clic en el botón.");
        }
    </script>

</body>
</html>
